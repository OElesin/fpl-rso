version: 0.2

# CodeBuild buildspec for FPL-RSO
# Two phases: BUILD (rebuild image + update AgentCore) and DEPLOY (update bot Lambda)
# Triggered by: EventBridge schedule or manual

env:
  variables:
    REGION: us-east-1
    ACCOUNT: "514965996716"
    ECR_REPO: 514965996716.dkr.ecr.us-east-1.amazonaws.com/fpl-rso
    AGENTCORE_ID: fplrso_loop-YvEJ6s29Vd
    STATE_TABLE: fpl-rso-state
    LAMBDA_ORCHESTRATOR: fpl-rso-orchestrator
    LAMBDA_BOT: fpl-rso-service-TelegramWebhook-7XLhspJ9YcHa
    LAMBDA_API: fpl-rso-service-FplRsoApi-GeTgg76wRBIi
    RULE_NAME: fpl-rso-iteration
    MODEL: claude-sonnet-5
    ITERATIONS: "50"
    SEASONS: '["2024-25","2025-26","2026-27"]'

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install boto3 requests

  pre_build:
    commands:
      - echo "Logging into ECR..."
      - aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REPO

  build:
    commands:
      - |
        if [ "$BUILD_PHASE" = "deploy_bot" ]; then
          echo "=== PHASE: Update bot with latest strategy ==="
          python deploy/codebuild_update_bot.py
        else
          echo "=== PHASE: Build image + kick off RSI loop ==="
          
          # Build and push Docker image.
          # AgentCore Runtime ONLY supports arm64 — an amd64 image is rejected by
          # update_agent_runtime with "Architecture incompatible", silently leaving
          # the runtime on a stale/broken version. We cross-build arm64 via buildx.
          # We also tag uniquely per build: reusing ":latest" does not reliably
          # trigger a new AgentCore version, so we pass a unique URI to the update.
          echo "Building arm64 Docker image..."
          IMAGE_TAG="build-$(date +%Y%m%d-%H%M%S)"
          docker run --privileged --rm tonistiigi/binfmt --install arm64 || true
          docker buildx create --use --name fplrsobuilder || docker buildx use fplrsobuilder
          docker buildx build --platform linux/arm64 \
            -f Dockerfile \
            -t $ECR_REPO:$IMAGE_TAG \
            -t $ECR_REPO:latest \
            --push .
          
          # Update AgentCore Runtime (use the UNIQUE tag so a new version is created)
          echo "Updating AgentCore to $ECR_REPO:$IMAGE_TAG ..."
          python -c "
          import boto3, time, sys
          client = boto3.client('bedrock-agentcore-control', region_name='$REGION')
          client.update_agent_runtime(
              agentRuntimeId='$AGENTCORE_ID',
              agentRuntimeArtifact={'containerConfiguration': {'containerUri': '$ECR_REPO:$IMAGE_TAG'}},
              roleArn='arn:aws:iam::$ACCOUNT:role/AgentCoreRuntimeRole',
              networkConfiguration={'networkMode': 'PUBLIC'},
          )
          # Wait for READY — fail the build if it never becomes READY
          for i in range(36):
              time.sleep(5)
              r = client.get_agent_runtime(agentRuntimeId='$AGENTCORE_ID')
              status = r['status']
              if status == 'READY':
                  print(f'AgentCore READY after {(i+1)*5}s (version {r[\"agentRuntimeVersion\"]})')
                  break
              if 'FAILED' in status:
                  print(f'AgentCore update FAILED: {status} {r.get(\"statusReason\",\"\")}')
                  sys.exit(1)
          else:
              print('AgentCore did not reach READY in time')
              sys.exit(1)
          "
          
          # Start a fresh run. We KEEP prior completed runs so the orchestrator
          # can seed the new run from the best previous strategy (compound learning).
          # Only stale non-completed runs from a prior aborted cycle are removed.
          RUN_ID="run-$(date +%Y%m%d-%H%M)"
          echo "Starting run: $RUN_ID"
          python -c "
          import boto3
          dynamodb = boto3.resource('dynamodb', region_name='$REGION')
          table = dynamodb.Table('$STATE_TABLE')
          scan = table.scan()
          removed = 0
          for item in scan.get('Items', []):
              # Preserve completed runs (they hold best strategies used for seeding).
              # Remove any leftover 'running'/'failed' runs from an aborted cycle.
              if item.get('status') != 'completed':
                  table.delete_item(Key={'run_id': item['run_id']})
                  removed += 1
          print(f'Cleared {removed} stale non-completed run(s); completed runs preserved for seeding')
          "
          
          # Update Lambda orchestrator config (RUN_ID is the fallback if no target input)
          aws lambda update-function-configuration \
            --function-name $LAMBDA_ORCHESTRATOR \
            --environment "Variables={STATE_TABLE=$STATE_TABLE,AGENTCORE_ARN=arn:aws:bedrock-agentcore:$REGION:$ACCOUNT:runtime/$AGENTCORE_ID,AWS_REGION_NAME=$REGION,EVENTBRIDGE_RULE=$RULE_NAME,RUN_ID=$RUN_ID,MAX_ITERATIONS=$ITERATIONS,MODEL=$MODEL,SEASONS=$SEASONS}" \
            --region $REGION > /dev/null
          
          # CRITICAL: update the iteration rule's target INPUT to the new RUN_ID.
          # The orchestrator prioritizes event['run_id'] over the env var, so a stale
          # target input would make it process an already-completed run and stop the loop.
          echo "Pointing iteration rule target at $RUN_ID"
          aws events put-targets \
            --rule $RULE_NAME \
            --region $REGION \
            --targets "[{\"Id\":\"fpl-rso-orchestrator\",\"Arn\":\"arn:aws:lambda:$REGION:$ACCOUNT:function:$LAMBDA_ORCHESTRATOR\",\"Input\":\"{\\\"run_id\\\": \\\"$RUN_ID\\\"}\"}]" \
            > /dev/null
          
          # Enable EventBridge rule to start the loop
          aws events enable-rule --name $RULE_NAME --region $REGION
          
          # Point the completion checker at THIS run so it only deploys when this
          # run completes (not any pre-existing completed run from a prior week).
          echo "Setting completion checker WATCH_RUN_ID=$RUN_ID"
          aws lambda update-function-configuration \
            --function-name fpl-rso-completion-checker \
            --environment "Variables={STATE_TABLE=$STATE_TABLE,WATCH_RUN_ID=$RUN_ID}" \
            --region $REGION > /dev/null
          
          # Enable completion checker (polls until RSI loop finishes)
          aws events enable-rule --name fpl-rso-completion-check --region $REGION
          
          echo "RSI loop started: $RUN_ID ($ITERATIONS iterations)"
          echo "Completion checker enabled — will auto-deploy bot when done"
        fi

  post_build:
    commands:
      - echo "Done."
