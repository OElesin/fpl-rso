<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="280" fill="#0a0a0f" rx="12"/>

  <!-- Local box -->
  <rect x="30" y="40" width="280" height="200" rx="12" fill="#12121a" stroke="#00cec9" stroke-width="2"/>
  <text x="50" y="70" fill="#00cec9" font-size="13" font-weight="600" font-family="monospace">LOCAL</text>
  <text x="50" y="95" fill="#8888a0" font-size="11" font-family="monospace">scripts/run.py</text>
  <text x="50" y="120" fill="#8888a0" font-size="11" font-family="sans-serif">• Load historical data</text>
  <text x="50" y="140" fill="#8888a0" font-size="11" font-family="sans-serif">• Run backtest evaluation</text>
  <text x="50" y="160" fill="#8888a0" font-size="11" font-family="sans-serif">• Selection (keep/reject)</text>
  <text x="50" y="180" fill="#8888a0" font-size="11" font-family="sans-serif">• State management</text>
  <text x="50" y="210" fill="#fdcb6e" font-size="10" font-family="sans-serif">Fast, data-heavy, cheap</text>

  <!-- AgentCore box -->
  <rect x="410" y="40" width="280" height="200" rx="12" fill="#12121a" stroke="#6c5ce7" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="430" y="70" fill="#6c5ce7" font-size="13" font-weight="600" font-family="monospace">AGENTCORE RUNTIME</text>
  <text x="430" y="95" fill="#8888a0" font-size="11" font-family="monospace">deploy/app.py</text>
  <text x="430" y="120" fill="#8888a0" font-size="11" font-family="sans-serif">• Strands Agent reasoning</text>
  <text x="430" y="140" fill="#8888a0" font-size="11" font-family="sans-serif">• Tool calls (6 tools)</text>
  <text x="430" y="160" fill="#8888a0" font-size="11" font-family="sans-serif">• Code validation + retry</text>
  <text x="430" y="180" fill="#8888a0" font-size="11" font-family="sans-serif">• Candidate generation</text>
  <text x="430" y="210" fill="#fdcb6e" font-size="10" font-family="sans-serif">Serverless, isolated, pay-per-use</text>

  <!-- Arrow: Local → AgentCore -->
  <path d="M 310 120 L 410 120" stroke="#e0e0e8" stroke-width="2"
        marker-end="url(#arrow-white)"/>
  <text x="335" y="110" fill="#8888a0" font-size="9" font-family="monospace">invoke</text>

  <!-- Arrow: AgentCore → Local -->
  <path d="M 410 160 L 310 160" stroke="#00b894" stroke-width="2"
        marker-end="url(#arrow-green)"/>
  <text x="330" y="175" fill="#8888a0" font-size="9" font-family="monospace">candidate</text>

  <!-- Pulse on arrows -->
  <circle r="4" fill="#e0e0e8">
    <animate attributeName="cx" values="310;410" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="120;120" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#00b894">
    <animate attributeName="cx" values="410;310" dur="1.5s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="160;160" dur="1.5s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="1.5s" begin="0.8s" repeatCount="indefinite"/>
  </circle>

  <defs>
    <marker id="arrow-white" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e0e0e8"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00b894"/>
    </marker>
  </defs>
</svg>
