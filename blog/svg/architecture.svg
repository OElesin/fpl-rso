<svg viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="720" height="480" fill="#0a0a0f" rx="12"/>

  <!-- Outer loop box -->
  <rect x="30" y="30" width="660" height="420" rx="16" fill="none"
        stroke="#6c5ce7" stroke-width="2" stroke-dasharray="8 4">
    <animate attributeName="stroke-dashoffset" from="0" to="-24"
             dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="50" y="60" fill="#6c5ce7" font-size="14" font-weight="600"
        font-family="monospace">OUTER LOOP (Strands Agent)</text>

  <!-- Inner agent box -->
  <rect x="80" y="90" width="260" height="200" rx="12" fill="#12121a"
        stroke="#00cec9" stroke-width="2"/>
  <text x="100" y="120" fill="#00cec9" font-size="13" font-weight="600"
        font-family="monospace">INNER AGENT</text>
  <text x="100" y="150" fill="#e0e0e8" font-size="12" font-family="sans-serif">strategy.py</text>

  <!-- Inner agent functions -->
  <text x="100" y="178" fill="#8888a0" font-size="11" font-family="monospace">select_transfers()</text>
  <text x="100" y="198" fill="#8888a0" font-size="11" font-family="monospace">select_captain()</text>
  <text x="100" y="218" fill="#8888a0" font-size="11" font-family="monospace">select_lineup()</text>
  <text x="100" y="238" fill="#8888a0" font-size="11" font-family="monospace">select_chip()</text>
  <text x="100" y="268" fill="#fd79a8" font-size="11" font-family="monospace">← rewritten each iteration</text>

  <!-- Eval harness box -->
  <rect x="80" y="310" width="260" height="120" rx="12" fill="#12121a"
        stroke="#fdcb6e" stroke-width="2"/>
  <text x="100" y="340" fill="#fdcb6e" font-size="13" font-weight="600"
        font-family="monospace">EVAL HARNESS</text>
  <text x="100" y="368" fill="#8888a0" font-size="11" font-family="monospace">Public GWs (60%) → feedback</text>
  <text x="100" y="388" fill="#8888a0" font-size="11" font-family="monospace">Private GWs (40%) → selection</text>
  <text x="100" y="410" fill="#8888a0" font-size="11" font-family="monospace">Backtest across seasons</text>

  <!-- Strands Agent box -->
  <rect x="400" y="90" width="260" height="340" rx="12" fill="#12121a"
        stroke="#6c5ce7" stroke-width="2"/>
  <text x="420" y="120" fill="#6c5ce7" font-size="13" font-weight="600"
        font-family="monospace">STRANDS AGENT</text>
  <text x="420" y="145" fill="#e0e0e8" font-size="11" font-family="sans-serif">Multi-step reasoning:</text>

  <!-- Tool list with animated dots -->
  <circle cx="425" cy="172" r="4" fill="#00cec9">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <text x="438" y="176" fill="#8888a0" font-size="11" font-family="monospace">read_current_strategy()</text>

  <circle cx="425" cy="200" r="4" fill="#00cec9">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <text x="438" y="204" fill="#8888a0" font-size="11" font-family="monospace">read_eval_results()</text>

  <circle cx="425" cy="228" r="4" fill="#00cec9">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <text x="438" y="232" fill="#8888a0" font-size="11" font-family="monospace">read_failed_attempts()</text>

  <circle cx="425" cy="256" r="4" fill="#00cec9">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.9s" repeatCount="indefinite"/>
  </circle>
  <text x="438" y="260" fill="#8888a0" font-size="11" font-family="monospace">read_iteration_info()</text>

  <circle cx="425" cy="284" r="4" fill="#fdcb6e">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="438" y="288" fill="#8888a0" font-size="11" font-family="monospace">validate_code()</text>

  <circle cx="425" cy="312" r="4" fill="#00b894">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="438" y="316" fill="#8888a0" font-size="11" font-family="monospace">write_candidate()</text>

  <!-- Bedrock badge -->
  <rect x="420" y="345" width="220" height="60" rx="8" fill="#1a1a2e"
        stroke="#6c5ce7" stroke-width="1"/>
  <text x="440" y="370" fill="#6c5ce7" font-size="11" font-weight="600"
        font-family="monospace">Amazon Bedrock</text>
  <text x="440" y="390" fill="#8888a0" font-size="10" font-family="monospace">Claude Sonnet / Nova / Llama</text>

  <!-- Arrows -->
  <path d="M 210 290 L 210 310" stroke="#fdcb6e" stroke-width="2"
        marker-end="url(#arrow-yellow)"/>

  <path d="M 340 370 L 400 370" stroke="#fdcb6e" stroke-width="1.5"
        stroke-dasharray="4 3" marker-end="url(#arrow-yellow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-14"
             dur="1.5s" repeatCount="indefinite"/>
  </path>

  <path d="M 400 190 L 340 190" stroke="#fd79a8" stroke-width="2"
        marker-end="url(#arrow-pink)">
    <animate attributeName="stroke-dashoffset" from="0" to="-14"
             dur="1.5s" repeatCount="indefinite"/>
  </path>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-yellow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fdcb6e"/>
    </marker>
    <marker id="arrow-pink" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fd79a8"/>
    </marker>
  </defs>
</svg>
