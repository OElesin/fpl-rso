<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="320" fill="#0a0a0f" rx="12"/>

  <!-- Step 1: Read -->
  <circle cx="80" cy="160" r="32" fill="#12121a" stroke="#00cec9" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="4s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <text x="80" y="155" text-anchor="middle" fill="#00cec9" font-size="20">&#128269;</text>
  <text x="80" y="175" text-anchor="middle" fill="#e0e0e8" font-size="9">READ</text>
  <text x="80" y="210" text-anchor="middle" fill="#8888a0" font-size="9">Inspect code</text>
  <text x="80" y="223" text-anchor="middle" fill="#8888a0" font-size="9">&amp; results</text>

  <!-- Step 2: Analyze -->
  <circle cx="210" cy="160" r="32" fill="#12121a" stroke="#6c5ce7" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="4s" begin="0.7s" repeatCount="indefinite"/>
  </circle>
  <text x="210" y="155" text-anchor="middle" fill="#6c5ce7" font-size="20">&#129504;</text>
  <text x="210" y="175" text-anchor="middle" fill="#e0e0e8" font-size="9">ANALYZE</text>
  <text x="210" y="210" text-anchor="middle" fill="#8888a0" font-size="9">Find weakness</text>
  <text x="210" y="223" text-anchor="middle" fill="#8888a0" font-size="9">&amp; check history</text>

  <!-- Step 3: Draft -->
  <circle cx="340" cy="160" r="32" fill="#12121a" stroke="#fd79a8" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="4s" begin="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="340" y="155" text-anchor="middle" fill="#fd79a8" font-size="20">&#9998;</text>
  <text x="340" y="175" text-anchor="middle" fill="#e0e0e8" font-size="9">DRAFT</text>
  <text x="340" y="210" text-anchor="middle" fill="#8888a0" font-size="9">Write improved</text>
  <text x="340" y="223" text-anchor="middle" fill="#8888a0" font-size="9">strategy code</text>

  <!-- Step 4: Validate -->
  <circle cx="470" cy="160" r="32" fill="#12121a" stroke="#fdcb6e" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="4s" begin="2.1s" repeatCount="indefinite"/>
  </circle>
  <text x="470" y="155" text-anchor="middle" fill="#fdcb6e" font-size="20">&#9989;</text>
  <text x="470" y="175" text-anchor="middle" fill="#e0e0e8" font-size="9">VALIDATE</text>
  <text x="470" y="210" text-anchor="middle" fill="#8888a0" font-size="9">Syntax check</text>
  <text x="470" y="223" text-anchor="middle" fill="#8888a0" font-size="9">&amp; self-correct</text>

  <!-- Step 5: Submit -->
  <circle cx="600" cy="160" r="32" fill="#12121a" stroke="#00b894" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="4s" begin="2.8s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="155" text-anchor="middle" fill="#00b894" font-size="20">&#128640;</text>
  <text x="600" y="175" text-anchor="middle" fill="#e0e0e8" font-size="9">SUBMIT</text>
  <text x="600" y="210" text-anchor="middle" fill="#8888a0" font-size="9">Pass to eval</text>
  <text x="600" y="223" text-anchor="middle" fill="#8888a0" font-size="9">harness</text>

  <!-- Connecting arrows -->
  <line x1="112" y1="160" x2="178" y2="160" stroke="#8888a0" stroke-width="1.5"
        marker-end="url(#arrow-muted)"/>
  <line x1="242" y1="160" x2="308" y2="160" stroke="#8888a0" stroke-width="1.5"
        marker-end="url(#arrow-muted)"/>
  <line x1="372" y1="160" x2="438" y2="160" stroke="#8888a0" stroke-width="1.5"
        marker-end="url(#arrow-muted)"/>
  <line x1="502" y1="160" x2="568" y2="160" stroke="#8888a0" stroke-width="1.5"
        marker-end="url(#arrow-muted)"/>

  <!-- Retry arrow (validate → draft) -->
  <path d="M 470 192 C 470 260, 340 260, 340 192" fill="none"
        stroke="#fdcb6e" stroke-width="1" stroke-dasharray="4 3"
        marker-end="url(#arrow-yellow-small)">
    <animate attributeName="stroke-dashoffset" from="0" to="-14"
             dur="2s" repeatCount="indefinite"/>
  </path>
  <text x="405" y="270" text-anchor="middle" fill="#fdcb6e" font-size="9">retry if invalid</text>

  <!-- Traveling dot -->
  <circle r="4" fill="#00cec9">
    <animate attributeName="cx" values="80;210;340;470;600;600" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="160;160;160;160;160;160" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;1;1;1;0" dur="4s" repeatCount="indefinite"/>
  </circle>

  <defs>
    <marker id="arrow-muted" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8888a0"/>
    </marker>
    <marker id="arrow-yellow-small" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#fdcb6e"/>
    </marker>
  </defs>
</svg>
