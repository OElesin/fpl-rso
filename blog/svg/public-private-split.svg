<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="200" fill="#0a0a0f" rx="12"/>

  <text x="40" y="30" fill="#e0e0e8" font-size="13" font-weight="600"
        font-family="sans-serif">Season Gameweeks (38 total)</text>

  <!-- Public (GW 5-27 ≈ 60%) -->
  <rect x="40" y="50" width="380" height="50" rx="6" fill="#6c5ce720" stroke="#6c5ce7" stroke-width="1.5">
    <animate attributeName="fill-opacity" values="0.1;0.25;0.1" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="230" y="80" text-anchor="middle" fill="#6c5ce7" font-size="12" font-weight="600">
    PUBLIC (60%) — visible to proposer as feedback
  </text>

  <!-- Private (GW 28-38 ≈ 40%) -->
  <rect x="430" y="50" width="250" height="50" rx="6" fill="#00b89420" stroke="#00b894" stroke-width="1.5">
    <animate attributeName="fill-opacity" values="0.1;0.3;0.1" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </rect>
  <text x="555" y="80" text-anchor="middle" fill="#00b894" font-size="12" font-weight="600">
    PRIVATE (40%) — selection signal
  </text>

  <!-- Explanation -->
  <text x="40" y="135" fill="#8888a0" font-size="11" font-family="sans-serif">
    Agent sees public scores → proposes strategy changes
  </text>
  <text x="40" y="155" fill="#8888a0" font-size="11" font-family="sans-serif">
    But ONLY private score improvement → keeps the change
  </text>
  <text x="40" y="180" fill="#fdcb6e" font-size="11" font-family="sans-serif">
    ⚡ This prevents overfitting to specific gameweeks
  </text>
</svg>
